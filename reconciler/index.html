<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reconciler — Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>(function(){try{var t=localStorage.getItem('tools-theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>
<nav class="hub-nav">
  <a href="../">⌂ Tools</a>
  <span class="sep">/</span>
  <span class="current">reconciler</span>
</nav>

<div class="app">
  <header class="tool-header">
    <h1>Reconciler</h1>
    <p class="subtitle">Match rows using 1–3 key columns, then review only what's different.</p>
  </header>

  <div class="upload-grid">
    <div class="drop-zone" id="zone-a">
      <input type="file" accept=".xlsx,.xls,.csv">
      <div class="drop-icon">📄</div>
      <div class="drop-label" id="label-a">File A — Source of truth</div>
      <div class="drop-sub" id="sub-a">Click or drag .xlsx / .csv</div>
    </div>
    <div class="drop-zone" id="zone-b">
      <input type="file" accept=".xlsx,.xls,.csv">
      <div class="drop-icon">📄</div>
      <div class="drop-label" id="label-b">File B — Compare against</div>
      <div class="drop-sub" id="sub-b">Click or drag .xlsx / .csv</div>
    </div>
  </div>

  <div class="config-panel">
    <div class="config-panel-header">
      <span class="config-panel-title">Match rows by</span>
      <div class="segmented-btns">
        <button class="segmented-btn active" onclick="setKeyCount(1,this)">1 key</button>
        <button class="segmented-btn" onclick="setKeyCount(2,this)">2 keys</button>
        <button class="segmented-btn" onclick="setKeyCount(3,this)">3 keys</button>
      </div>
    </div>
    <div class="config-rows">
      <div class="config-row" id="key-row-1">
        <div class="config-row-num">1</div>
        <div class="field">
          <label>File A column</label>
          <select id="key-a-1" onchange="syncKeyCol(1)"><option value="">— load file A —</option></select>
        </div>
        <div class="field">
          <label>File B column</label>
          <select id="key-b-1"><option value="">— load file B —</option></select>
        </div>
      </div>
      <div class="config-row hidden" id="key-row-2">
        <div class="config-row-num">2</div>
        <div class="field">
          <label>File A column</label>
          <select id="key-a-2" onchange="syncKeyCol(2)"><option value="">— load file A —</option></select>
        </div>
        <div class="field">
          <label>File B column</label>
          <select id="key-b-2"><option value="">— load file B —</option></select>
        </div>
      </div>
      <div class="config-row hidden" id="key-row-3">
        <div class="config-row-num">3</div>
        <div class="field">
          <label>File A column</label>
          <select id="key-a-3" onchange="syncKeyCol(3)"><option value="">— load file A —</option></select>
        </div>
        <div class="field">
          <label>File B column</label>
          <select id="key-b-3"><option value="">— load file B —</option></select>
        </div>
      </div>
    </div>
  </div>

  <div class="run-row">
    <button class="btn-primary" id="run-btn" onclick="reconcile()" disabled>Compare →</button>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <div class="results" id="results">
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">Only in File A</div>
        <div class="stat-value removed" id="cnt-removed">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Only in File B</div>
        <div class="stat-value added" id="cnt-added">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Matched with differences</div>
        <div class="stat-value changed" id="cnt-changed">0</div>
      </div>
    </div>

    <div class="toolbar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All discrepancies</button>
      <button class="filter-btn" data-filter="removed" onclick="setFilter('removed',this)">Only in A</button>
      <button class="filter-btn" data-filter="added" onclick="setFilter('added',this)">Only in B</button>
      <button class="filter-btn" data-filter="changed" onclick="setFilter('changed',this)">Differences</button>
      <button class="btn-secondary push-right" onclick="exportResults()">⬇ Export .xlsx</button>
    </div>

    <div id="disc-table"></div>
  </div>
</div>

<script src="../assets/shared.js"></script>
<script>
const { val, makeKey, escHtml } = TOOLS;

let dataA = [], dataB = [], headersA = [], headersB = [];
let allDiscrepancies = [];
let activeKeyCount = 1;

document.addEventListener('DOMContentLoaded', () => {
  TOOLS.setupDropZone(document.getElementById('zone-a'), file => loadFile(file, 'a'));
  TOOLS.setupDropZone(document.getElementById('zone-b'), file => loadFile(file, 'b'));
  TOOLS.initThemeSwitcher();
});

function setKeyCount(n, btn) {
  activeKeyCount = n;
  document.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  for (let i = 1; i <= 3; i++) {
    document.getElementById('key-row-' + i).classList.toggle('hidden', i > n);
  }
}

function populateKeySelects(side, headers) {
  for (let i = 1; i <= 3; i++) {
    const sel = document.getElementById('key-' + side + '-' + i);
    sel.innerHTML = headers.map(h => `<option value="${escHtml(h)}">${escHtml(h)}</option>`).join('');
  }
}

function handleLoaded(which, file, rows, headers) {
  if (which === 'a') {
    dataA = rows; headersA = headers;
    populateKeySelects('a', headers);
    document.getElementById('label-a').textContent = file.name;
    document.getElementById('sub-a').textContent = rows.length + ' rows · ' + headers.length + ' columns';
    document.getElementById('zone-a').classList.add('loaded');
    for (let i = 1; i <= 3; i++) syncKeyCol(i);
  } else {
    dataB = rows; headersB = headers;
    populateKeySelects('b', headers);
    document.getElementById('label-b').textContent = file.name;
    document.getElementById('sub-b').textContent = rows.length + ' rows · ' + headers.length + ' columns';
    document.getElementById('zone-b').classList.add('loaded');
  }
  checkRunnable();
}

function loadFile(file, which) {
  TOOLS.parseSpreadsheet(file, (err, rows, headers) => {
    if (err) { TOOLS.showError('error-banner', err); return; }
    TOOLS.showError('error-banner', '');
    handleLoaded(which, file, rows, headers);
  });
}

function syncKeyCol(i) {
  const selA = document.getElementById('key-a-' + i);
  const selB = document.getElementById('key-b-' + i);
  if (!selA || !selB) return;
  const v = selA.value;
  const match = Array.from(selB.options).find(o => o.value === v);
  if (match) selB.value = v;
}

function checkRunnable() {
  document.getElementById('run-btn').disabled = !(dataA.length && dataB.length);
}

function getActiveKeys() {
  const keysA = [], keysB = [];
  for (let i = 1; i <= activeKeyCount; i++) {
    const a = document.getElementById('key-a-' + i).value;
    const b = document.getElementById('key-b-' + i).value;
    if (!a || !b) return null;
    keysA.push(a);
    keysB.push(b);
  }
  return { keysA, keysB };
}

function getSharedCols(keysA, keysB) {
  const setA = new Set(keysA), setB = new Set(keysB);
  const nonKeyA = headersA.filter(h => !setA.has(h));
  const nonKeyB = new Set(headersB.filter(h => !setB.has(h)));
  return nonKeyA.filter(c => nonKeyB.has(c));
}

function reconcile() {
  TOOLS.showError('error-banner', '');
  const keys = getActiveKeys();
  if (!keys) { TOOLS.showError('error-banner', 'Please select key columns for all active key rows.'); return; }
  const { keysA, keysB } = keys;
  const sharedCols = getSharedCols(keysA, keysB);

  const mapB = new Map();
  dataB.forEach(row => {
    const k = makeKey(row, keysB);
    if (k.replace(/\u0000/g, '').length > 0) mapB.set(k, row);
  });

  const seenKeys = new Set();
  const discs = [];

  dataA.forEach(rowA => {
    const k = makeKey(rowA, keysA);
    if (!k.replace(/\u0000/g, '').length) return;
    seenKeys.add(k);
    if (!mapB.has(k)) {
      discs.push({ type: 'removed', keysA, keysB, rowA, rowB: null, diffs: {} });
    } else {
      const rowB = mapB.get(k);
      const diffs = {};
      sharedCols.forEach(col => {
        const a = val(rowA[col]), b = val(rowB[col]);
        if (a !== b) diffs[col] = { a, b };
      });
      if (Object.keys(diffs).length > 0) {
        discs.push({ type: 'changed', keysA, keysB, rowA, rowB, diffs });
      }
    }
  });

  dataB.forEach(rowB => {
    const k = makeKey(rowB, keysB);
    if (!k.replace(/\u0000/g, '').length || seenKeys.has(k)) return;
    discs.push({ type: 'added', keysA, keysB, rowA: null, rowB, diffs: {} });
  });

  allDiscrepancies = discs;
  document.getElementById('cnt-removed').textContent = discs.filter(d => d.type === 'removed').length;
  document.getElementById('cnt-added').textContent = discs.filter(d => d.type === 'added').length;
  document.getElementById('cnt-changed').textContent = discs.filter(d => d.type === 'changed').length;
  document.getElementById('results').classList.add('visible');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  renderTable(discs, sharedCols, keysA, keysB);
}

function setFilter(f, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (!allDiscrepancies.length) return;
  const d0 = allDiscrepancies[0];
  const sharedCols = getSharedCols(d0.keysA, d0.keysB);
  const filtered = f === 'all' ? allDiscrepancies : allDiscrepancies.filter(d => d.type === f);
  renderTable(filtered, sharedCols, d0.keysA, d0.keysB);
}

function renderTable(discs, sharedCols, keysA, keysB) {
  const wrap = document.getElementById('disc-table');
  if (!discs.length) {
    wrap.innerHTML = '<div class="empty-state">No discrepancies found for this filter.</div>';
    return;
  }

  let html = '<div class="table-wrap"><table><thead><tr><th>Status</th>';
  keysA.forEach(k => { html += `<th class="key-col">${escHtml(k)}</th>`; });
  sharedCols.forEach(c => { html += `<th>${escHtml(c)}</th>`; });
  html += '</tr></thead><tbody>';

  discs.forEach(d => {
    const label = d.type === 'removed' ? 'Only in A' : d.type === 'added' ? 'Only in B' : 'Differs';
    html += `<tr class="row-${d.type}"><td><span class="badge ${d.type}">${label}</span></td>`;

    keysA.forEach((kA, i) => {
      const kB = d.keysB[i];
      const v = d.type === 'removed' ? val(d.rowA[kA])
              : d.type === 'added'   ? val(d.rowB[kB])
              :                        val(d.rowA[kA]);
      html += `<td><strong>${escHtml(v)}</strong></td>`;
    });

    sharedCols.forEach(col => {
      if (d.type === 'removed') {
        html += `<td>${escHtml(val(d.rowA[col]))}</td>`;
      } else if (d.type === 'added') {
        html += `<td>${escHtml(val(d.rowB[col]))}</td>`;
      } else if (d.diffs[col]) {
        html += `<td><span class="cell-old">${escHtml(d.diffs[col].a)}</span><span class="cell-new">${escHtml(d.diffs[col].b)}</span></td>`;
      } else {
        html += `<td>${escHtml(val(d.rowA[col]))}</td>`;
      }
    });

    html += '</tr>';
  });

  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

function exportResults() {
  if (!allDiscrepancies.length) return;
  const d0 = allDiscrepancies[0];
  const { keysA, keysB } = d0;
  const sharedCols = getSharedCols(keysA, keysB);

  const rows = allDiscrepancies.map(d => {
    const row = { Status: d.type === 'removed' ? 'Only in A' : d.type === 'added' ? 'Only in B' : 'Differs' };
    keysA.forEach((kA, i) => {
      const kB = keysB[i];
      row[kA] = d.type === 'removed' ? val(d.rowA[kA])
              : d.type === 'added'   ? val(d.rowB[kB])
              :                        val(d.rowA[kA]);
    });
    sharedCols.forEach(col => {
      if (d.type === 'removed') {
        row[col] = val(d.rowA[col]);
      } else if (d.type === 'added') {
        row[col] = val(d.rowB[col]);
      } else if (d.diffs[col]) {
        row[col + ' (File A)'] = d.diffs[col].a;
        row[col + ' (File B)'] = d.diffs[col].b;
      } else {
        row[col] = val(d.rowA[col]);
      }
    });
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Discrepancies');
  XLSX.writeFile(wb, 'reconciliation-results.xlsx');
}
</script>
</body>
</html>
