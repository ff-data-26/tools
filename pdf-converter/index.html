<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Converter — Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>(function(){try{var t=localStorage.getItem('tools-theme');if(t&&t!=='default')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../assets/shared.css">
<style>
  .conv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 1rem; }
  .thumb { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface); text-align: center; }
  .thumb img { max-width: 100%; max-height: 220px; background: #fff; border: 1px solid var(--border); }
  .thumb small { display: block; color: var(--text-muted); margin: 6px 0 2px; }
  .thumb a { font-size: 13px; color: inherit; }
  .opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; padding: 16px; }
  #status { color: var(--text-muted); font-size: 13px; margin-right: auto; }
</style>
</head>
<body>
<nav class="hub-nav">
  <a href="../">⌂ Tools</a>
  <span class="sep">/</span>
  <span class="current">pdf-converter</span>
</nav>

<div class="app">
  <header class="tool-header">
    <h1>PDF Converter</h1>
    <p class="subtitle">Turn PDF pages into PNG, JPG or WebP images. Download one page or the whole set as a ZIP.</p>
  </header>

  <div class="upload-grid single">
    <div class="drop-zone" id="zone">
      <input type="file" accept="application/pdf,.pdf">
      <div class="drop-icon">📄</div>
      <div class="drop-label" id="label">PDF — Convert to images</div>
      <div class="drop-sub" id="sub">Click or drag a .pdf</div>
    </div>
  </div>

  <div class="config-panel">
    <div class="config-panel-header"><span class="config-panel-title">Output</span></div>
    <div class="opt-grid">
      <div class="field">
        <label for="fmt">Format</label>
        <select id="fmt" onchange="onFmt()">
          <option value="image/png">PNG (lossless)</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="field">
        <label for="dpi">Resolution</label>
        <select id="dpi">
          <option value="72">72 DPI (screen)</option>
          <option value="150" selected>150 DPI (standard)</option>
          <option value="200">200 DPI</option>
          <option value="300">300 DPI (print)</option>
        </select>
      </div>
      <div class="field" id="q-wrap" style="display:none">
        <label for="quality">Quality: <span id="q-val">90</span>%</label>
        <input type="range" id="quality" min="40" max="100" value="90" oninput="document.getElementById('q-val').textContent=this.value">
      </div>
      <div class="field">
        <label for="pages">Pages (blank = all)</label>
        <input type="text" id="pages" placeholder="e.g. 1-3, 5, 8">
      </div>
    </div>
  </div>

  <div class="run-row">
    <span id="status"></span>
    <button class="btn-secondary" id="zip-btn" onclick="downloadZip()" style="display:none;margin-right:10px">⬇ Download all (.zip)</button>
    <button class="btn-primary" id="run-btn" onclick="convert()" disabled>Convert →</button>
  </div>

  <div class="error-banner" id="error-banner"></div>
  <div class="conv-grid" id="grid"></div>
</div>

<script src="../assets/shared.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
const EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };
let pdf = null, baseName = 'document', results = [], urls = [];

document.addEventListener('DOMContentLoaded', () => {
  TOOLS.setupDropZone($('zone'), loadFile);
  TOOLS.initThemeSwitcher();
});

function onFmt() { $('q-wrap').style.display = $('fmt').value === 'image/png' ? 'none' : ''; }

function clearResults() {
  urls.forEach(URL.revokeObjectURL); urls = []; results = [];
  $('grid').innerHTML = ''; $('zip-btn').style.display = 'none';
}

async function loadFile(file) {
  clearResults(); TOOLS.showError('error-banner', ''); $('status').textContent = '';
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
    TOOLS.showError('error-banner', 'That is not a PDF file.'); return;
  }
  try {
    pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    baseName = file.name.replace(/\.pdf$/i, '');
    $('label').textContent = file.name;
    $('sub').textContent = pdf.numPages + (pdf.numPages === 1 ? ' page' : ' pages');
    $('zone').classList.add('loaded');
    $('run-btn').disabled = false;
  } catch (err) {
    pdf = null; $('run-btn').disabled = true;
    TOOLS.showError('error-banner', err.name === 'PasswordException'
      ? 'This PDF is password-protected.' : 'Could not read this PDF.');
  }
}

function parsePages(str, max) {
  if (!str.trim()) return Array.from({ length: max }, (_, i) => i + 1);
  const set = new Set();
  for (const part of str.split(',')) {
    const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if (!m) throw new Error('Invalid page range: "' + part.trim() + '"');
    let a = +m[1], b = m[2] ? +m[2] : a;
    if (a > b) [a, b] = [b, a];
    for (let i = Math.max(1, a); i <= Math.min(max, b); i++) set.add(i);
  }
  if (!set.size) throw new Error('No pages in range (document has ' + max + ').');
  return [...set].sort((a, b) => a - b);
}

async function convert() {
  let pages;
  try { pages = parsePages($('pages').value, pdf.numPages); }
  catch (e) { TOOLS.showError('error-banner', e.message); return; }
  TOOLS.showError('error-banner', '');
  clearResults();
  $('run-btn').disabled = true;
  const type = $('fmt').value, scale = +$('dpi').value / 72, q = +$('quality').value / 100;
  const pad = String(pdf.numPages).length;
  try {
    for (let i = 0; i < pages.length; i++) {
      $('status').textContent = `Converting page ${pages[i]} (${i + 1}/${pages.length})…`;
      const page = await pdf.getPage(pages[i]);
      const vp = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await new Promise(r => canvas.toBlob(r, type, q));
      canvas.width = canvas.height = 0;
      if (!blob) throw new Error('Your browser could not encode ' + EXT[type].toUpperCase() + '.');
      const name = `${baseName}_page${String(pages[i]).padStart(pad, '0')}.${EXT[type]}`;
      const url = URL.createObjectURL(blob); urls.push(url);
      results.push({ name, blob });
      $('grid').insertAdjacentHTML('beforeend',
        `<div class="thumb"><img src="${url}" alt="Page ${pages[i]}"><small>Page ${pages[i]} · ${(blob.size / 1024).toFixed(0)} KB</small><a href="${url}" download="${TOOLS.escHtml(name)}">⬇ Download</a></div>`);
    }
    $('status').textContent = `Done — ${results.length} image${results.length === 1 ? '' : 's'}.`;
    if (results.length > 1) $('zip-btn').style.display = '';
  } catch (e) {
    TOOLS.showError('error-banner', e.message);
  }
  $('run-btn').disabled = false;
}

async function downloadZip() {
  $('status').textContent = 'Building ZIP…';
  const z = new JSZip();
  results.forEach(r => z.file(r.name, r.blob));
  const blob = await z.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = baseName + '_images.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  $('status').textContent = 'ZIP downloaded.';
}
</script>
</body>
</html>
